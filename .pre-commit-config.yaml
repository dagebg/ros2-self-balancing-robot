# Run `pre-commit install` once; hooks then run on every commit.
# CI runs `pre-commit run --all-files`, so local and CI checks are identical.
exclude: ^(mechanical_hardware/|docs/img/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.bat$
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^firmware/.*/\.vscode/  # PlatformIO writes JSON with comments
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: local
    hooks:
      - id: robot-config-header
        name: robot_config.hpp matches config/robot_params.yaml
        entry: python tools/gen_config.py --check
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        files: ^(config/robot_params\.yaml|tools/gen_config\.py|firmware/esp32/robot-firmware/include/robot_config\.hpp)$
        pass_filenames: false
