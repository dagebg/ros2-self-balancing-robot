server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed assets never change: cache them for a year. index.html is always revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
