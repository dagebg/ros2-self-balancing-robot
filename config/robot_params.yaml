# Robot parameters: the single source of truth for constants shared by the
# firmware, the ROS 2 packages and the simulation.
#
# Every entry has a value, a unit and a `measured` flag. `measured: false` marks a
# placeholder that still has to be determined on the real robot; see the
# calibration guide in the docs.
#
# After editing, regenerate the firmware header:
#   python tools/gen_config.py
# (pre-commit and CI fail if the header is out of date.)

geometry:
  wheel_radius:
    value: 0.0325
    unit: m
    measured: false
    doc: Radius of the drive wheels, including the tyre.
  track_width:
    value: 0.150
    unit: m
    measured: false
    doc: Distance between the contact points of the two wheels.
  com_height:
    value: 0.080
    unit: m
    measured: false
    doc: Height of the centre of mass above the wheel axle.
  body_mass:
    value: 0.900
    unit: kg
    measured: false
    doc: Total mass of the robot without the wheels.

drivetrain:
  gear_ratio:
    value: 150.0
    unit: "1"
    measured: false
    doc: Motor revolutions per wheel revolution.
  encoder_pulses_per_motor_rev:
    value: 7
    unit: "1"
    measured: false
    doc: Pulses per motor-shaft revolution on one encoder channel (before x4 decoding).
  motor_supply_voltage:
    value: 11.5
    unit: V
    measured: true
    doc: Voltage of the motor rail (U3 converter) feeding TB6612 VM.
  motor_rated_voltage:
    value: 6.0
    unit: V
    measured: false
    doc: Rated voltage of the N20 motors; limits the maximum PWM duty cycle.

control:
  loop_rate:
    value: 200
    unit: Hz
    measured: true
    doc: Rate of the balance control loop on the ESP32.
  telemetry_rate:
    value: 50
    unit: Hz
    measured: true
    doc: Rate at which the ESP32 sends telemetry to the Pi.

link:
  uart_baud:
    value: 460800
    unit: Bd
    measured: true
    doc: Baud rate of the ESP32 <-> Raspberry Pi UART link.

# --- Firmware only ---------------------------------------------------------------------------
# Determined on the robot with the bring-up firmware (see the hardware bring-up guide).

wiring:
  left_motor_channel:
    value: 0
    unit: "-"
    measured: false
    doc: TB6612 channel driving the left wheel (0 = A, 1 = B); the other wheel uses the other one.
  left_motor_inverted:
    value: 0
    unit: "-"
    measured: false
    doc: 1 if a positive command turns the left wheel backwards.
  right_motor_inverted:
    value: 1
    unit: "-"
    measured: false
    doc: 1 if a positive command turns the right wheel backwards.
  left_encoder_connector:
    value: 6
    unit: "-"
    measured: false
    doc: Encoder connector of the left wheel (5 = J5, 6 = J6); the other wheel uses the other one.
  left_encoder_inverted:
    value: 0
    unit: "-"
    measured: false
    doc: 1 if the left encoder counts down while the wheel turns forwards.
  right_encoder_inverted:
    value: 1
    unit: "-"
    measured: false
    doc: 1 if the right encoder counts down while the wheel turns forwards.

imu_mounting:
  mpu9250_body_x:
    value: 1
    unit: axis
    measured: false
    doc: MPU-9250 axis along body x (forward). 1/2/3 = sensor x/y/z, negative = reversed.
  mpu9250_body_y:
    value: 2
    unit: axis
    measured: false
    doc: MPU-9250 axis along body y (left).
  mpu9250_body_z:
    value: 3
    unit: axis
    measured: false
    doc: MPU-9250 axis along body z (up).
  mpu6050_body_x:
    value: -1
    unit: axis
    measured: false
    doc: MPU-6050 axis along body x (forward). Default assumes it faces backwards.
  mpu6050_body_y:
    value: -2
    unit: axis
    measured: false
    doc: MPU-6050 axis along body y (left).
  mpu6050_body_z:
    value: 3
    unit: axis
    measured: false
    doc: MPU-6050 axis along body z (up).
