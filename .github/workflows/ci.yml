name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and format (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Test Python tools
        run: pytest

  firmware:
    name: Firmware (unit tests, build, static analysis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp32/robot-firmware
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        working-directory: .
        run: pip install -r requirements-dev.txt

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/**/platformio.ini') }}

      - name: Unit tests (host)
        run: pio test -e native

      - name: Build firmware (placeholder credentials)
        run: pio run -e esp32

      - name: Report firmware size
        run: |
          {
            echo '### Firmware size'
            echo '```'
            pio run -e esp32 -t size | grep -E '^(RAM|Flash):'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Static analysis (cppcheck + clang-tidy)
        run: pio check -e esp32 --fail-on-defect=high --fail-on-defect=medium

      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: |
            firmware/esp32/robot-firmware/.pio/build/esp32/firmware.bin
            firmware/esp32/robot-firmware/.pio/build/esp32/firmware.elf
