name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and format (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Test Python tools
        run: pytest

  shared-libs:
    name: Shared C++ libraries (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [coverage, sanitizers]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Configure
        run: |
          if [ "${{ matrix.variant }}" = coverage ]; then
            variant_flag=-DROBOT_COVERAGE=ON
          else
            variant_flag=-DROBOT_SANITIZERS=ON
          fi
          cmake -S shared -B build/shared -G Ninja -DROBOT_WARNINGS_AS_ERRORS=ON "$variant_flag"

      - name: Build
        run: cmake --build build/shared

      - name: Test
        run: ctest --test-dir build/shared --output-on-failure

      - name: clang-tidy
        if: matrix.variant == 'coverage'
        run: clang-tidy -p build/shared shared/*/src/*.cpp

      - name: Coverage report (fails below 90 % line coverage)
        if: matrix.variant == 'coverage'
        run: |
          mkdir -p coverage
          gcovr -r . --filter 'shared/.*/(src|include)/' build/shared \
            --html-details coverage/index.html --txt coverage/summary.txt \
            --fail-under-line 90
          { echo '### Shared library coverage'; echo '```'; cat coverage/summary.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.variant == 'coverage'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shared
          path: coverage/

  firmware:
    name: Firmware (unit tests, build, static analysis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp32/robot-firmware
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        working-directory: .
        run: pip install -r requirements-dev.txt

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/**/platformio.ini') }}

      - name: Unit tests (host)
        run: pio test -e native

      - name: Build firmware (placeholder credentials)
        run: pio run -e esp32

      - name: Build bring-up tool
        run: pio run -e bringup

      - name: Report firmware size
        run: |
          {
            echo '### Firmware size'
            echo '```'
            pio run -e esp32 -t size | grep -E '^(RAM|Flash):'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Static analysis (cppcheck + clang-tidy)
        run: pio check -e esp32 --fail-on-defect=high --fail-on-defect=medium

      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: |
            firmware/esp32/robot-firmware/.pio/build/esp32/firmware.bin
            firmware/esp32/robot-firmware/.pio/build/esp32/firmware.elf
            firmware/esp32/robot-firmware/.pio/build/bringup/firmware.bin

  ros2:
    name: ROS 2 packages (build and test in ros:jazzy)
    runs-on: ubuntu-latest
    container: ros:jazzy
    defaults:
      run:
        shell: bash
        working-directory: ros2_ws
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (rosdep)
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src ../shared --ignore-src --rosdistro jazzy -y \
            --skip-keys "rviz2 joint_state_publisher_gui"

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src ../shared/*/ --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --base-paths src ../shared/*/ --return-code-on-test-failure \
            --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-test-results
          path: ros2_ws/build/*/test_results/
