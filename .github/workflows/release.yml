name: Release

# Pushing a tag vX.Y.Z publishes a GitHub Release with firmware images, the web app and release
# notes generated from the Conventional Commits since the previous tag. Docker images for the same
# tag are published by docker.yml.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build artifacts and publish the release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tools
        run: pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build firmware and bring-up tool
        working-directory: firmware/esp32/robot-firmware
        run: |
          pio run -e esp32
          pio run -e bringup

      - name: Package firmware images
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          tools/merge_firmware.sh esp32 "dist/robot-firmware-${tag}.bin"
          tools/merge_firmware.sh bringup "dist/robot-bringup-${tag}.bin"
          cp firmware/esp32/robot-firmware/.pio/build/esp32/firmware.elf "dist/robot-firmware-${tag}.elf"

      - name: Build web app
        working-directory: webapp
        run: |
          npm ci
          npm run build
          (cd dist && zip -qr "../../dist/robot-webapp-${GITHUB_REF_NAME}.zip" .)

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
