; PlatformIO project for the robot's ESP32 firmware.
; https://docs.platformio.org/page/projectconf.html
;
;   pio run -e esp32               build the firmware
;   pio run -e esp32 -t upload     flash it (stop the Pi bridge first, UART0 is shared)
;   pio test -e native             run the unit tests on the host
;   pio run -e bringup -t upload   flash the hardware bring-up tool instead (see docs)
;   pio check -e esp32             cppcheck + clang-tidy

[platformio]
default_envs = esp32

[env]
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
test_framework = googletest
; Hardware-independent libraries shared with the ROS 2 side (see shared/).
lib_deps =
  symlink://../../../shared/balance_core
  symlink://../../../shared/robot_protocol

[env:esp32]
platform = espressif32@7.1.3
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck, clangtidy
check_flags =
  cppcheck: --std=c++17 --suppressions-list=.cppcheck-suppressions --inline-suppr
  clangtidy: --config-file=.clang-tidy --extra-arg=-std=gnu++17 --extra-arg=-Wno-#pragma-messages
build_src_filter = +<*> -<bringup/>
check_src_filters =
  +<include/*>
  +<src/*>
  +<lib/*>

; Interactive hardware bring-up tool: same board, different application.
[env:bringup]
extends = env:esp32
build_src_filter = +<bringup/>

; Host build for unit tests: only hardware-independent libraries are compiled.
[env:native]
platform = native
build_type = debug
lib_ignore =
  telemetry
  hal_arduino
test_build_src = no
